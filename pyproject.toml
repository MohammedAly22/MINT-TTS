[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-tts"
version = "0.1.0"
description = "MINT-TTS: Minimal Inference Needed for Text-to-Speech -- learned per-token and per-frame compute allocation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "soundfile>=0.12",
    "tensorboard>=2.14",
    "matplotlib>=3.7",
    "num2words>=0.5.13",
    "phonemizer>=3.2",
    "espeakng-loader>=0.2",
    "g2p_en>=2.1",
    "nltk>=3.8",
]

[project.optional-dependencies]
extras = ["wandb>=0.16", "huggingface_hub>=0.20", "faster-whisper>=1.0", "pyworld>=0.3"]
figures = ["plotly>=6.1.1", "kaleido>=1.0", "pillow>=10.0"]
dev = ["pytest>=7.4", "pyflakes>=3.0"]

[tool.setuptools.packages.find]
include = ["mint_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
